<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embercrest</title>
    <link rel="icon" href="./assets/images/hud/portrait-mage.png" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./js/main.js"></script>
  </head>
  <body class="game">
    <div class="backdrop"></div>
    <main>
      <h1>Embercrest</h1>
      <div class="stage">
        <canvas id="canvas" width="960" height="540">
          Dein Browser unterstützt kein Canvas.
        </canvas>
        <div class="touch-controls">
          <div class="touch-group">
            <button id="touch-left" class="touch-button" aria-label="Move left">
              <img src="./assets/images/ui/touch/left.png" alt="" />
            </button>
            <button
              id="touch-right"
              class="touch-button"
              aria-label="Move right"
            >
              <img src="./assets/images/ui/touch/right.png" alt="" />
            </button>
          </div>
          <div class="touch-group">
            <button id="touch-cancel" class="touch-button" aria-label="Menu">
              <img src="./assets/images/ui/touch/menu.png" alt="" />
            </button>
            <button id="touch-talk" class="touch-button" aria-label="Talk">
              <img src="./assets/images/ui/touch/talk.png" alt="" />
            </button>
            <button id="touch-attack" class="touch-button" aria-label="Attack">
              <img src="./assets/images/ui/touch/attack.png" alt="" />
            </button>
            <button id="touch-jump" class="touch-button" aria-label="Jump">
              <img src="./assets/images/ui/touch/jump.png" alt="" />
            </button>
          </div>
        </div>
      </div>
      <p class="rotate-hint">Please rotate your device.</p>
    </main>
    <footer>
      <p>Sounds by Little Robot Sound Factory</p>
      <a href="./assets/audio/credits.txt">Credits</a>
      <a href="./legal-notice.html">Legal notice</a>
    </footer>
  </body>
</html>
